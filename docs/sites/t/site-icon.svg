  <path d="M14 34 L32 18 L50 34" fill="none" stroke="#f4f5f7" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M19 32 V46 H45 V32" fill="none" stroke="#f4f5f7" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
