<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 366" fill="none" role="img" aria-label="Oaks Roofing &amp; Construction">
  <!--
    Oaks Roofing & Construction — vector mark.

    Rebuilt 2026-08-19 against the company's real artwork, recovered from their
    archived site. Three things were wrong before: the orange was #e8720c (a
    guess — the real value sampled from the artwork is #fa6404), the hammer was
    drawn in solid black when it is actually knocked OUT of the house as
    negative space, and the whole mark was portrait (200x232) when the real
    lockup is landscape (900x366) with a "ROOFING, SIDING, GUTTERS" tagline.

    Type is sized to fit the WIDEST fallback (Arial Black), not to match
    Montserrat exactly. textLength/lengthAdjust was tried first and is not
    honoured by librsvg — which is what renders the generated PDFs — so the
    wordmark clipped at both ends there while looking fine in a browser. In a
    browser with Montserrat loaded the wordmark therefore sits a little narrower
    than the real lockup; that is the deliberate trade for never clipping in a
    document.

    This file is referenced by companyProfile/oaks brand.logoUrl and by
    generated documents — its PATH must not change.

    AUTHORITATIVE ARTWORK: assets/img/logo.png (900x366, transparent).
    Prefer the PNG wherever the real lockup is reproduced at size; this SVG is
    a faithful-but-simplified vector of it.
  -->
  <defs>
    <mask id="orcHammerKnockout">
      <!-- white keeps, black cuts -->
      <rect x="0" y="0" width="900" height="240" fill="#fff"/>
      <g stroke="#000" fill="#000" stroke-linecap="round" stroke-linejoin="round">
        <line x1="404" y1="212" x2="512" y2="72" stroke-width="19"/>
        <path d="M488 50 L534 96 L518 112 L472 66 Z"/>
        <path d="M534 96 L550 79 Q557 71 550 61 L540 50" stroke-width="13" fill="none"/>
      </g>
    </mask>
  </defs>

  <g mask="url(#orcHammerKnockout)">
    <!-- House body -->
    <path d="M362 118 L450 34 L538 118 L538 226 L362 226 Z" fill="#fa6404"/>
    <!-- Roof overhang -->
    <path d="M340 124 L450 20 L560 124" stroke="#fa6404" stroke-width="19" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Chimney -->
    <rect x="506" y="42" width="26" height="56" fill="#fa6404"/>
  </g>

  <text x="450" y="300" text-anchor="middle"
        font-family="Montserrat, 'Arial Black', Impact, sans-serif" font-weight="900"
        font-size="38" fill="#fa6404">OAKS ROOFING &amp; CONSTRUCTION</text>
  <text x="450" y="338" text-anchor="middle"
        font-family="Montserrat, Arial, sans-serif" font-weight="700" font-style="italic"
        font-size="21" letter-spacing="1" fill="#fa6404">ROOFING, SIDING, GUTTERS</text>
</svg>
