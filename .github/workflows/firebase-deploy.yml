name: Firebase deploy

# Auto-deploys the site to Firebase on every push to main.
#
# Gracefully skips when the FIREBASE_SERVICE_ACCOUNT secret is not
# configured — that way this file can live in main from day one
# without generating failure emails before go-live.
#
# Deploy order (when the secret IS set):
#   1. Hosting (FIRST — so a rules/functions auth-flake never starves content)
#   2. Firestore rules + indexes (pro project)
#   3. Storage rules
#   4. Cloud Functions
#
# ─────────────────────────────────────────────────────────────
# REQUIRED GITHUB ACTIONS SECRET (one-time setup to enable deploys)
# ─────────────────────────────────────────────────────────────
# Name:  FIREBASE_SERVICE_ACCOUNT
# Value: the contents of a Firebase service-account JSON file with
#        Cloud Functions Deployer + Cloud Datastore User + Firebase
#        Hosting Admin + Firebase Rules Admin roles.
#
# How to generate:
#   1. Firebase Console → Project Settings → Service accounts →
#      "Generate new private key" → download JSON
#   2. GitHub repo → Settings → Secrets and variables → Actions →
#      New repository secret → name: FIREBASE_SERVICE_ACCOUNT,
#      value: paste the entire JSON file contents
#   3. NEVER commit the JSON to the repo. GitHub Secrets are the
#      only place it should live.
#
# Until the secret is set, every workflow run will be a quick
# "skipped — secret not configured" notice, NOT a failure email.
# ─────────────────────────────────────────────────────────────

on:
  push:
    branches:
      - main
    paths:
      # Skip doc-only changes
      - 'docs/**'
      - 'functions/**'
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'storage.rules'
      - 'firebase.json'
      - '.github/workflows/firebase-deploy.yml'
  workflow_dispatch:
    inputs:
      scope:
        description: 'What to deploy'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - hosting
          - functions
          - rules

concurrency:
  group: firebase-deploy
  cancel-in-progress: false

jobs:
  # ─────────────────────────────────────────────────────────
  # check — read whether the secret is set. Always succeeds.
  # Outputs `configured=true|false` for the deploy job's `if:`.
  # This runs without accessing the secret's value, only its presence,
  # so it's cheap and GitHub-Actions-safe.
  # ─────────────────────────────────────────────────────────
  check:
    name: Check if Firebase credentials are configured
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -n "$SA" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "::notice::FIREBASE_SERVICE_ACCOUNT is set — proceeding to deploy."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            {
              echo "### ⏸ Firebase deploy skipped"
              echo ""
              echo "The \`FIREBASE_SERVICE_ACCOUNT\` repository secret is not configured yet."
              echo "Auto-deploy is intentionally disabled until it's set — this is a safety feature, not an error."
              echo ""
              echo "**To enable auto-deploy:**"
              echo ""
              echo "1. Firebase Console → Project Settings → Service Accounts → *Generate new private key* → download the JSON."
              echo "2. GitHub repo → Settings → Secrets and variables → Actions → **New repository secret**"
              echo "   - Name: \`FIREBASE_SERVICE_ACCOUNT\`"
              echo "   - Value: paste the entire JSON file contents"
              echo "3. Push to main (or manually re-run this workflow from the Actions tab)."
              echo ""
              echo "Until then every push will show this notice instead of failing."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::FIREBASE_SERVICE_ACCOUNT is not set — skipping deploy (this is expected before go-live)."
          fi

  # ─────────────────────────────────────────────────────────
  # deploy — runs only when credentials are present. Never runs on
  # an un-configured repo, so no more failure emails pre-go-live.
  # ─────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Firebase
    needs: check
    if: needs.check.outputs.configured == 'true'
    runs-on: ubuntu-latest
    # Bumped 15 -> 30: the real (strict) functions deploy alone can run
    # ~10-13 min; with the tolerant retry now bounded below, this leaves
    # comfortable headroom so Hosting always reaches its step.
    # Bumped 30 -> 40 (2026-07-23): the CPU-quota straggler-retry rounds in the
    # strict functions step add up to ~3 paused re-deploys of the failed subset.
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      PRO_PROJECT: nobigdeal-pro
      NODE_VERSION: '22'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      # The blog index ships its post cards as static HTML between
      # BLOG-STATIC markers (SEO/AEO: JS-injected cards are invisible to
      # crawlers). Regenerate at deploy time so future-dated posts in the
      # POSTS array flip from JS-only countdown to static card the first
      # deploy after their publish date — no manual step. The committed
      # HTML already carries the current output; this only refreshes it.
      # Soft-fail on purpose: the committed HTML already carries the current
      # generated block, so if the POSTS file is ever re-hashed/renamed or the
      # markers move, deploying the committed (possibly stale) block beats
      # aborting the whole deploy job (hosting + rules + functions) over a
      # blog-card refresh. The ::warning keeps the failure visible in the run.
      - name: Regenerate static blog index
        if: ${{ github.event_name == 'push' || github.event.inputs.scope == 'all' || github.event.inputs.scope == 'hosting' }}
        run: |
          node scripts/build-blog-index.mjs docs/assets/js/inline/c00f1acac9.js docs/blog/index.html \
            || echo "::warning::static blog index regeneration failed — deploying the committed static block as-is"

      # Same shape for the Featured Projects gallery (docs/our-work.html is
      # generated from assets/data/projects.json). Restamping here is what
      # flips a future-dated project live on the first deploy after its date.
      - name: Regenerate static projects gallery
        if: ${{ github.event_name == 'push' || github.event.inputs.scope == 'all' || github.event.inputs.scope == 'hosting' }}
        run: |
          node scripts/build-projects.mjs \
            || echo "::warning::static projects regeneration failed — deploying the committed static block as-is"

      # Same soft-fail rationale. --write only syncs the URL SET (new/removed
      # pages); existing lastmods are preserved by design and the git-date
      # mode is local-only (CI checkout is shallow, git dates would be wrong).
      - name: Sync sitemap URL set
        if: ${{ github.event_name == 'push' || github.event.inputs.scope == 'all' || github.event.inputs.scope == 'hosting' }}
        run: |
          node scripts/build-sitemap.js --write \
            || echo "::warning::sitemap regeneration failed — deploying the committed sitemap as-is"

      - name: Install Cloud Functions dependencies
        working-directory: functions
        run: |
          if [ -f package-lock.json ]; then
            npm ci || npm install
          else
            npm install
          fi

      # Writes the service account JSON via an env var instead of shell
      # interpolation, which avoids GitHub Actions' "possible secret
      # exposure" warnings and is the recommended pattern.
      - name: Write service-account JSON to a temp file
        id: sa
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          SA_FILE="$RUNNER_TEMP/firebase-sa.json"
          printf '%s' "$SA_JSON" > "$SA_FILE"
          if [ ! -s "$SA_FILE" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT resolved to empty at deploy time."
            exit 1
          fi
          echo "sa_path=$SA_FILE" >> "$GITHUB_OUTPUT"

      # ── Gate — the frontend must be provably non-broken before it ships ──
      #
      # This workflow does NOT depend on the CI workflow; both trigger on the
      # same push to main and run in parallel. So until this gate existed, the
      # rules deploy was gated (below), the functions deploy was gated (below),
      # and Hosting — the surface every user actually touches — shipped with
      # nothing in front of it. A push that broke every test still put the
      # whole frontend into production.
      #
      # Both checks below are deliberately chosen to be FAST and FLAKE-PROOF,
      # because the hosting-first ordering exists to protect content delivery
      # from *deploy-step* flakes (the #732/#736 auth races) and a gate that
      # can itself flake would give that guarantee back:
      #   - No network, no emulator, no browser, no credentials.
      #   - No npm install (both are Node-builtins only).
      #   - Measured locally over the full tree: ~4s (459 files) and ~0.5s
      #     (211 pages / 20k refs). Negligible against a ~10-13 min deploy.
      # Anything slower or network-dependent belongs in ci.yml, not here.
      #
      # A failure here is real: a shipped .js that parses under neither
      # grammar, or a dead internal link / 404'd asset / broken anchor.
      #
      # Placement is deliberate: this runs AFTER the blog-index and sitemap
      # regeneration steps above, which rewrite docs/ at deploy time. So the
      # integrity check validates the content that ACTUALLY ships, including
      # the freshly generated blog cards — which the ci.yml copy of this check
      # (running against the committed tree) structurally cannot do. Those two
      # generators soft-fail by design; this is what catches it when a
      # soft-failed or malformed regeneration would have shipped a broken page.
      - name: Gate — shipped JS must parse + site integrity must hold
        if: ${{ github.event_name == 'push' || github.event.inputs.scope == 'all' || github.event.inputs.scope == 'hosting' }}
        run: |
          set -e
          node scripts/check-js-syntax.js
          node scripts/check-site-integrity.js --quiet
          # Shared-partial drift, checked against the tree that actually ships.
          # --check writes nothing: if a region were restamped here the deploy
          # would silently publish content that is not in the repo. Failing
          # instead keeps docs/ the single source of truth for what is live.
          node scripts/apply-partials.js --check

      # Hosting deploys FIRST — before rules / indexes / storage / functions —
      # so a transient auth-race flake on the rules deploy (the recurring
      # "Failed to authenticate" abort that took out deploys #732 + #736) can
      # never starve the user-facing hosting deploy. Hosting (static content)
      # has no dependency on rules or functions. The rules + functions steps
      # still run after this and still fail the job on a real error (functions
      # stay gated behind the rules deploy), so regressions are surfaced — they
      # just no longer block the frontend from shipping.
      #
      # NOTE: "first" is about DEPLOY ordering, not about skipping validation —
      # the static pre-flight gate above still runs ahead of this step.
      - name: Deploy Hosting
        if: ${{ github.event_name == 'push' || github.event.inputs.scope == 'all' || github.event.inputs.scope == 'hosting' }}
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.sa.outputs.sa_path }}
        run: |
          # GitHub runs `run:` blocks with `bash -e` (errexit), which would abort
          # the script the moment the captured `firebase deploy` command exits
          # non-zero — BEFORE the benign-string check below runs. Disable errexit
          # so we handle exit codes explicitly. (#781 added the check but missed
          # this, so the step still false-RED'd on the first attempt.)
          set +e
          for attempt in 1 2 3; do
            out=$(npx firebase-tools deploy --only hosting --project "$PRO_PROJECT" --non-interactive 2>&1)
            rc=$?
            echo "$out"
            if [ $rc -eq 0 ]; then
              echo "✓ Hosting deployed (attempt $attempt)."
              exit 0
            fi
            # Benign concurrent-deploy race: the parallel dev worktrees push main
            # together, so two deploy jobs run at once. The upload + finalize
            # succeed in both; the loser's RELEASE call returns HTTP 400
            # "supplied version ... is the current active version" because the
            # other job already released this exact content. Hosting IS up to
            # date — treat as success, not a flake. (Real hosting failures don't
            # carry this string and still retry/fail below.) This stops every
            # deploy from going false-RED, which was masking genuine failures.
            if echo "$out" | grep -q "is the current active version"; then
              echo "✓ Hosting already at the current version (a concurrent deploy released it) — treating as success."
              exit 0
            fi
            echo "::warning::Hosting deploy attempt $attempt failed — retrying in 15s…"
            sleep 15
          done
          echo "::error::Hosting deploy failed after 3 attempts."
          exit 1

      # ─────────────────────────────────────────────────────────
      # Enable APIs that firebase-tools doesn't auto-enable. 2nd-gen
      # onSchedule functions need cloudscheduler.googleapis.com (the
      # CLI enables pubsub + eventarc automatically, but Scheduler is
      # on us). beforeUserCreated blocking triggers need Identity
      # Toolkit enabled for the blocking-functions config.
      # Idempotent — already-enabled APIs get a fast no-op.
      # ─────────────────────────────────────────────────────────
      - name: Enable required Google APIs
        if: ${{ github.event_name == 'push' || github.event.inputs.scope == 'all' || github.event.inputs.scope == 'functions' }}
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.sa.outputs.sa_path }}
        run: |
          set +e
          gcloud auth activate-service-account --key-file="$GOOGLE_APPLICATION_CREDENTIALS"
          gcloud config set project "$PRO_PROJECT" --quiet
          # APIs firebase-tools doesn't auto-enable:
          #   cloudscheduler        — 2nd-gen onSchedule functions
          #   identitytoolkit       — beforeUserCreated/SignedIn blockers
          #   pubsub + eventarc     — 2nd-gen Storage / Firestore triggers
          #                           (onObjectFinalized, onDocumentWritten,
          #                           etc. fire through Eventarc → Pub/Sub)
          #   run, cloudbuild, artifactregistry — Gen 2 runtime substrate
          gcloud services enable \
            cloudscheduler.googleapis.com \
            identitytoolkit.googleapis.com \
            pubsub.googleapis.com \
            eventarc.googleapis.com \
            run.googleapis.com \
            cloudbuild.googleapis.com \
            artifactregistry.googleapis.com \
            --project "$PRO_PROJECT" --quiet
          EXIT=$?
          if [ $EXIT -ne 0 ]; then
            echo "::warning::gcloud services enable returned $EXIT (SA likely lacks roles/serviceusage.serviceUsageAdmin). Manually enable in Cloud Console: cloudscheduler, identitytoolkit, pubsub, eventarc, run, cloudbuild, artifactregistry."
          fi
          # Generate the service identity for Pub/Sub. Gen-2 Storage
          # triggers (onAudioUploaded in voice-intelligence.js) fail
          # with "Error generating the service identity for
          # pubsub.googleapis.com" the first time after enabling the
          # API until this identity is explicitly provisioned.
          # Idempotent: succeeds quickly if already exists.
          for api in pubsub eventarc; do
            gcloud beta services identity create --service=${api}.googleapis.com \
              --project "$PRO_PROJECT" --quiet 2>/dev/null
          done
          echo "✓ Required APIs + service identities provisioned (or already on)."
          exit 0

      # ─────────────────────────────────────────────────────────
      # Ensure every integration secret my code defineSecret()'s
      # exists in Secret Manager. Any that are missing get created
      # with an empty value — the lazy-opt-in pattern in the runtime
      # code treats an empty string as "this integration isn't
      # configured, skip it" (see integrations/_shared.js hasSecret).
      #
      # Existing secrets (Stripe / Twilio / Resend / etc.) are LEFT
      # ALONE — we only create what's missing, never overwrite.
      #
      # Without this step the deploy fails the first time any new
      # `defineSecret('FOO')` is introduced, because firebase-tools
      # in non-interactive mode requires the secret resource to
      # already exist.
      # ─────────────────────────────────────────────────────────
      - name: Ensure integration secrets exist (stub if missing)
        if: ${{ github.event_name == 'push' || github.event.inputs.scope == 'all' || github.event.inputs.scope == 'functions' }}
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.sa.outputs.sa_path }}
        run: |
          set -e
          gcloud auth activate-service-account --key-file="$GOOGLE_APPLICATION_CREDENTIALS"
          gcloud config set project "$PRO_PROJECT" --quiet
          # Auto-discover every name referenced by a defineSecret(...)
          # call in functions/. This catches both new integration
          # secrets and any pre-existing secrets that happen to be
          # unset in this project (e.g., GOOGLE_GEOCODING_API_KEY
          # was declared in code but never provisioned). Secrets that
          # already exist with real values are untouched — the check
          # below only adds a version when missing.
          ALL_SECRETS=$(grep -rhoE "defineSecret\(\s*['\"][A-Z0-9_]+['\"]" functions/ \
            | sed -E "s/.*defineSecret\(\s*['\"]([A-Z0-9_]+)['\"].*/\1/" \
            | sort -u)
          echo "Discovered secrets: $(echo $ALL_SECRETS | wc -w)"
          echo "$ALL_SECRETS"
          # Firebase CLI needs each secret to have an initial *non-empty*
          # version, otherwise it errors with "has no latest version".
          # Stub with the sentinel value __unset__ which the runtime
          # hasSecret() check in integrations/_shared.js treats as
          # "not configured" and falls through to the lazy-opt-in path.
          STUB='__unset__'
          for SECRET in $ALL_SECRETS; do
            if gcloud secrets describe "$SECRET" --project "$PRO_PROJECT" >/dev/null 2>&1; then
              # Make sure there's at least one version. If the secret
              # exists but was previously created empty (bad stub from
              # an earlier deploy attempt), add the sentinel version
              # now so Firebase CLI is satisfied.
              if ! gcloud secrets versions list "$SECRET" --project "$PRO_PROJECT" --limit=1 --format='value(name)' 2>/dev/null | grep -q .; then
                echo "+ $SECRET exists but has zero versions — adding sentinel"
                printf '%s' "$STUB" | gcloud secrets versions add "$SECRET" --data-file=- --project "$PRO_PROJECT" --quiet
              else
                echo "✓ $SECRET already exists with a version (leaving real value intact)"
              fi
            else
              echo "+ creating stub $SECRET with sentinel value — integration will no-op at runtime until you set a real value"
              printf '%s' "$STUB" | gcloud secrets create "$SECRET" --data-file=- --project "$PRO_PROJECT" --quiet
            fi
          done

      # firebase-tools >= 15 (bumped in #551) dropped support for Java < 21.
      # The Firestore emulator the rules gate below spins up needs a JDK 21+
      # on JAVA_HOME, or `firebase-tools emulators:exec` aborts with
      # "no longer supports Java version before 21". The runner's default
      # JDK (and/or the gcloud steps above) leaves JAVA_HOME < 21, which
      # silently broke EVERY deploy after #551 merged. Pin Temurin 21 here.
      - name: Set up JDK 21 (firebase-tools 15 emulator requirement)
        if: ${{ github.event_name == 'push' || github.event.inputs.scope == 'all' || github.event.inputs.scope == 'rules' }}
        uses: actions/setup-java@v5.6.0
        with:
          distribution: 'temurin'
          java-version: '21'

      # AUDIT #2 (Phase 8.4): gate the rules deploy on the rules tests.
      # A regression that reopens a cross-tenant hole or flips an
      # allow/deny must NOT ship. Runs the same emulator suite as CI;
      # a non-zero exit stops the job HERE — before any rules (or the
      # functions/hosting steps below) deploy. Same `if:` condition as
      # the rules-deploy step so it only runs when we're deploying rules.
      - name: Gate — Firestore rules tests must pass before deploy
        if: ${{ github.event_name == 'push' || github.event.inputs.scope == 'all' || github.event.inputs.scope == 'rules' }}
        run: |
          set -e
          cd tests
          npm ci --silent || npm install --silent --no-audit --no-fund
          npx firebase-tools emulators:exec --only firestore --project nbd-rules-test 'node firestore-rules.test.js'
          npx firebase-tools emulators:exec --only firestore --project nbd-xtenant-test 'node firestore-rules.cross-tenant.test.js'
          npx firebase-tools emulators:exec --only firestore --project nbd-commlog-test 'node communication-log-contract.test.js'

      # Rules deploy is idempotent. The CLI intermittently fails the FIRST
      # attempt with a transient auth race ("Failed to authenticate, have you
      # run firebase login?") that clears on a re-run — and because this step
      # runs BEFORE hosting with no continue-on-error, that flake used to abort
      # the entire deploy (content didn't go live until a manual re-run). Retry
      # in-job up to 3x so the transient auth race self-heals instead of going
      # RED. A genuine failure still fails the workflow after the retries.
      - name: Deploy Firestore rules (pro)
        if: ${{ github.event_name == 'push' || github.event.inputs.scope == 'all' || github.event.inputs.scope == 'rules' }}
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.sa.outputs.sa_path }}
        run: |
          set -e
          for attempt in 1 2 3; do
            if npx firebase-tools deploy --only firestore:rules --project "$PRO_PROJECT" --non-interactive; then
              echo "✓ Firestore rules deployed (attempt $attempt)."
              exit 0
            fi
            echo "::warning::Firestore rules deploy attempt $attempt failed (likely transient auth race) — retrying in 15s…"
            sleep 15
          done
          echo "::error::Firestore rules deploy failed after 3 attempts."
          exit 1

      # Firestore composite indexes ship before functions so every
      # new .where() query has its index ready when the function
      # execution first hits it.
      #
      # Known firebase-tools quirk: the CLI returns non-zero on any
      # HTTP 409 ("index already exists") — even when the partial
      # set of indexes it CAN create succeeds. Sometimes an index
      # exists from a prior console edit or manual deploy and
      # blocks every subsequent run. We tolerate non-zero here so
      # rules / functions / hosting still roll out; the raw CLI
      # output in the log tells us exactly which index conflicted.
      # F-10: index deploy now distinguishes 409 "already exists" (a
      # benign no-op) from every other failure. Previously `set +e`
      # swallowed ALL errors, which would mask a real problem like a
      # malformed composite index spec or a permissions regression.
      - name: Deploy Firestore indexes (pro)
        if: ${{ github.event_name == 'push' || github.event.inputs.scope == 'all' || github.event.inputs.scope == 'rules' }}
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.sa.outputs.sa_path }}
        run: |
          set +e
          LOG="$RUNNER_TEMP/firestore-indexes.log"
          npx firebase-tools deploy --only firestore:indexes --project "$PRO_PROJECT" --non-interactive 2>&1 | tee "$LOG"
          EXIT=${PIPESTATUS[0]}
          if [ $EXIT -eq 0 ]; then
            echo "✓ Firestore indexes deployed cleanly."
            exit 0
          fi
          # Positive 409 filter — accept ONLY if every non-OK line was
          # an "already exists" conflict. Anything else is a real error.
          if grep -qiE 'error|failed|denied|permission' "$LOG" \
             && ! grep -qiE 'already exists|409' "$LOG"; then
            echo "::error::Firestore index deploy failed with a non-409 error (exit $EXIT). Fix it before merging."
            exit $EXIT
          fi
          # Mixed 409 + other lines: if any non-409 error is present,
          # fail. If only 409s, tolerate.
          if grep -qiE 'error|failed|denied|permission' "$LOG" \
             && grep -vE 'already exists|409' "$LOG" | grep -qiE 'error|failed|denied|permission'; then
            echo "::error::Firestore index deploy had a non-409 error mixed with 409s. Fix and re-run."
            exit $EXIT
          fi
          echo "::warning::Index deploy hit 'already exists' (409) only. Treating as no-op."
          exit 0

      # F-10: Storage rules deploy MUST fail the workflow if it fails.
      # Previously we swallowed the exit code and shipped functions +
      # hosting against a stale rules set — which is exactly the kind
      # of silent regression a security audit flags. If IAM is missing
      # for the deploy SA, fix IAM once, not every push.
      - name: Deploy Storage rules (pro)
        if: ${{ github.event_name == 'push' || github.event.inputs.scope == 'all' || github.event.inputs.scope == 'rules' }}
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.sa.outputs.sa_path }}
        run: |
          set -e
          for attempt in 1 2 3; do
            if npx firebase-tools deploy --only storage --project "$PRO_PROJECT" --non-interactive; then
              echo "✓ Storage rules deployed (attempt $attempt)."
              exit 0
            fi
            echo "::warning::Storage rules deploy attempt $attempt failed (likely transient auth race) — retrying in 15s…"
            sleep 15
          done
          echo "::error::Storage rules deploy failed after 3 attempts."
          exit 1

      # F-10 + Q8: functions deploy is strict by default — any failure
      # fails the workflow. But there's an explicit exception list for
      # functions whose DEPLOY blocks on IAM the GitHub Actions deploy
      # SA doesn't have:
      #
      #   cloudscheduler.jobs.update  → schedule-function binding update
      #   identityplatform.admin      → blocking-trigger registration
      #
      # These 8 functions have no code changes in the normal case; the
      # SA just can't refresh their Cloud Scheduler job / Identity
      # Platform config. Previous deploys succeeded because the SA
      # had broader roles; IAM drift revoked them at some point.
      #
      # Strategy:
      #  1. Main deploy = everything EXCEPT the 8 known-blocked names.
      #     Strict — failure fails the workflow.
      #  2. Second step (tolerant) retries ONLY the 8. Permission
      #     errors there produce a warning, not a failure. When ops
      #     grants roles/cloudscheduler.admin + roles/identityplatform.admin
      #     to the deploy SA, empty NBD_DEPLOY_SKIP_LIST and the main
      #     step handles them.
      #
      # Full remediation runbook: see POST_DEPLOY_CHECKLIST §16.
      #
      # --force auto-confirms deletion of orphan functions. --debug
      # was retained on 2026-04-14 to diagnose the IAM-denial cascade;
      # removed now that the split-deploy strategy works cleanly. If
      # a future deploy goes opaque again, add --debug back as the
      # first investigation step.
      # AUDIT #4 (6.1): gate the functions deploy on the smoke suite, mirroring
      # ci.yml's smoke-tests job. functions/ deps are already installed above
      # (Install Cloud Functions dependencies), so the photo-vision sanitizer
      # test's require() resolves. A red suite blocks the deploy instead of
      # shipping a regression the suite would have caught.
      - name: Gate — function smoke suite must pass before deploy
        if: ${{ github.event_name == 'push' || github.event.inputs.scope == 'all' || github.event.inputs.scope == 'functions' }}
        run: node tests/smoke.test.js

      - name: Deploy Cloud Functions (strict — retries CPU-quota stragglers)
        if: ${{ github.event_name == 'push' || github.event.inputs.scope == 'all' || github.event.inputs.scope == 'functions' }}
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.sa.outputs.sa_path }}
          # Names that fail with cloudscheduler.jobs.update or
          # identityplatform.admin denials. Clear this list once
          # those roles are granted.
          # recordingRetentionCron added 2026-04-15: scheduled fn from
          # voice-intelligence.js fails on update (same SA gap).
          NBD_DEPLOY_SKIP_LIST: "onRepSignup"
          # Batched-retry knobs for the Cloud Run CPU-quota mitigation below.
          NBD_DEPLOY_RETRY_ROUNDS: "3"   # extra passes over just the stragglers
          NBD_DEPLOY_RETRY_PAUSE: "45"   # let wave-1 revisions settle + old ones tear down (frees CPU)
          NBD_DEPLOY_BATCH_SIZE: "20"    # cap concurrent new revisions per retry chunk
          NBD_DEPLOY_BATCH_PAUSE: "20"
        run: |
          # WHY THIS STEP RETRIES (root cause, diagnosed 2026-07-23):
          # We deploy ~160 Gen2 functions. A single bulk `firebase deploy` rolls
          # out ALL their new Cloud Run revisions at once; during the rollout the
          # old + new revisions both hold CPU (worst for the minInstances
          # functions — render-pdf/stripe/claudeProxy keep warm instances), and
          # the peak blows past the region's "Total allowable CPU per project per
          # region" quota. A RANDOM subset of revisions then fails its Container
          # Healthcheck ("Revision X is not ready and cannot serve traffic") —
          # which is exactly why a different ~5-10% of functions failed to UPDATE
          # on every deploy (runs 2026-07-23 17:26 / 19:06, and 07-23 03:24),
          # never the changed code, never a create. Those functions kept their
          # correct prior revision (no outage) but the job went red every time,
          # which masks genuine failures.
          #
          # MITIGATION: keep the fast single bulk pass (wave 1), then re-deploy
          # ONLY the stragglers in small batches after a pause. A handful of new
          # revisions rolls out under quota once wave 1 has settled. If functions
          # STILL fail after the retries, that's a REAL failure and the job fails
          # (with the residual list) instead of hiding behind the chronic red.
          # DURABLE FIX (not in this workflow): raise the Cloud Run CPU quota for
          # us-central1 in the GCP console — see the step summary on failure.
          set +e   # we manage exit codes explicitly by parsing per-pass failures

          ALL=$(grep -rhE "^exports\.[a-zA-Z_][a-zA-Z0-9_]* *= *(onRequest|onCall|beforeUserCreated|beforeUserSignedIn|onSchedule|onDocumentCreated|onDocumentUpdated|onDocumentWritten|onDocumentDeleted|functions\.https\.onRequest|functions\.https\.onCall|functions\.firestore|functions\.auth|functions\.pubsub)" functions/*.js functions/integrations/*.js functions/handlers/*.js functions/migrations/runner.js 2>/dev/null \
                | sed -E 's/^exports\.([a-zA-Z_][a-zA-Z0-9_]*) *=.*/\1/' \
                | sort -u)
          INCLUDE=""
          for fn in $ALL; do
            if echo ",${NBD_DEPLOY_SKIP_LIST}," | grep -q ",${fn},"; then
              echo "⏭  skipping $fn (IAM-blocked; skip-list)"
            else
              INCLUDE="${INCLUDE},functions:${fn}"
            fi
          done
          INCLUDE="${INCLUDE#,}"  # trim leading comma
          if [ -z "$INCLUDE" ]; then
            echo "::error::No functions left to deploy after skip-list"; exit 1
          fi

          FAILED_FILE=$(mktemp)
          WHOLESALE_FILE=$(mktemp)
          # _deploy_only <comma-separated functions:NAME list> — runs the deploy,
          # echoes firebase output to the log, and appends any failed function
          # names to FAILED_FILE. firebase prints "Failed to (create|update)
          # function NAME in region ..." per failure; that's what we parse.
          #
          # WHOLESALE-FAILURE GUARD (2026-08-10 audit): the per-function parse
          # is the ONLY failure signal the step used to have, so a deploy that
          # died BEFORE per-function rollout (auth error, config parse, quota
          # abort — exit != 0 with zero "Failed to ..." lines) produced an
          # empty FAILED set and the step printed "✓ All functions deployed"
          # while deploying nothing. Capture the exit code; nonzero with no
          # parsed per-function failures = wholesale failure, recorded and
          # fatal at the end.
          _deploy_only() {
            [ -z "$1" ] && return 0
            local out rc parsed
            out=$(npx firebase-tools deploy --only "$1" --project "$PRO_PROJECT" --non-interactive --force 2>&1)
            rc=$?
            echo "$out"
            parsed=$(echo "$out" | grep -oE "Failed to (create|update) function [A-Za-z_][A-Za-z0-9_]*" \
                                 | sed -E 's/.*function //')
            [ -n "$parsed" ] && echo "$parsed" >> "$FAILED_FILE"
            if [ "$rc" -ne 0 ] && [ -z "$parsed" ]; then
              echo "wholesale deploy failure: exit $rc with no per-function failure lines (targets: $1)" >> "$WHOLESALE_FILE"
            fi
          }
          # _deploy_batched <newline-separated names> — deploys in chunks of
          # NBD_DEPLOY_BATCH_SIZE so a large straggler set never re-creates the
          # all-at-once CPU spike.
          _deploy_batched() {
            local batch="" n=0 fn only
            for fn in $1; do
              batch="$batch $fn"; n=$((n+1))
              if [ "$n" -ge "$NBD_DEPLOY_BATCH_SIZE" ]; then
                only=$(echo $batch | tr ' ' '\n' | grep -v '^$' | sed 's/^/functions:/' | paste -sd, -)
                _deploy_only "$only"; batch=""; n=0; sleep "$NBD_DEPLOY_BATCH_PAUSE"
              fi
            done
            if [ -n "$(echo $batch | tr -d ' ')" ]; then
              only=$(echo $batch | tr ' ' '\n' | grep -v '^$' | sed 's/^/functions:/' | paste -sd, -)
              _deploy_only "$only"
            fi
          }

          # ── wave 1: the fast single bulk deploy (unchanged behavior) ──
          echo "Deploying $(echo "$INCLUDE" | awk -F',' '{print NF}') function(s) in one pass"
          _deploy_only "$INCLUDE"
          FAILED=$(sort -u "$FAILED_FILE")

          # ── retry rounds: only the stragglers, batched + paused ──
          round=0
          while [ -n "$FAILED" ] && [ "$round" -lt "$NBD_DEPLOY_RETRY_ROUNDS" ]; do
            round=$((round+1))
            echo "::warning::$(echo "$FAILED" | grep -c .) function(s) failed to deploy (likely Cloud Run CPU-quota healthcheck) — retry round $round/$NBD_DEPLOY_RETRY_ROUNDS after ${NBD_DEPLOY_RETRY_PAUSE}s"
            echo "$FAILED" | sed 's/^/    straggler: /'
            sleep "$NBD_DEPLOY_RETRY_PAUSE"
            : > "$FAILED_FILE"
            _deploy_batched "$FAILED"
            FAILED=$(sort -u "$FAILED_FILE")
          done

          if [ -s "$WHOLESALE_FILE" ] && [ -z "$FAILED" ]; then
            echo "::error::Cloud Functions deploy failed WHOLESALE (nonzero exit before per-function rollout) — nothing or almost nothing was deployed"
            {
              echo "### ❌ Cloud Functions deploy — wholesale failure"
              echo ""
              echo "The firebase-tools deploy exited nonzero WITHOUT any per-function"
              echo "failure lines — it died before per-function rollout (auth, config,"
              echo "or quota abort). Until 2026-08-10 this exact mode reported"
              echo "\"✓ All functions deployed\" and went green."
              echo ""
              sed 's/^/  - /' "$WHOLESALE_FILE"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ -n "$FAILED" ]; then
            echo "::error::Cloud Functions still failing after $NBD_DEPLOY_RETRY_ROUNDS retries"
            {
              echo "### ❌ Cloud Functions deploy — unresolved after $NBD_DEPLOY_RETRY_ROUNDS retries"
              echo ""
              echo "These functions did NOT deploy even after batched retries:"
              echo ""
              echo "$FAILED" | sed 's/^/  - /'
              echo ""
              echo "If the per-function error is \`Container Healthcheck failed. Quota"
              echo "exceeded for total allowable CPU per project per region\`, the batched"
              echo "retry wasn't enough headroom — the durable fix is a **Cloud Run CPU"
              echo "quota increase** for \`us-central1\` (GCP console → IAM & Admin →"
              echo "Quotas → filter \"Cloud Run Admin API\" / \"Total allowable CPU\")."
              echo "Otherwise these are a genuine deploy failure worth investigating."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "✓ All functions deployed$( [ "$round" -gt 0 ] && echo " (after $round straggler-retry round(s))" )."

      # Second pass: retry the skip-list with tolerance. If IAM has
      # since been granted, these succeed. If not, the warning is
      # surfaced in the workflow summary and the rest of the
      # deploy (Hosting, etc.) continues. Scheduled + blocking
      # functions still run their LAST deployed revision — it's the
      # update that fails, not the runtime.
      - name: Deploy Cloud Functions (tolerant — IAM-blocked retry)
        # ROOT-CAUSE FIX (deploy run 27631207476 starved Hosting): this retry
        # of the GCIP/IAM-blocked skip-list (onRepSignup) had NO step timeout,
        # so it ran until the job timeout-minutes cap canceled the WHOLE job —
        # the canceled job skipped the Deploy Hosting step below, even though
        # this step's comment promises "the rest of the deploy (Hosting, etc.)
        # continues." continue-on-error + a step timeout make that promise real:
        # a slow/hung retry self-bounds and the job proceeds to Hosting.
        if: ${{ github.event_name == 'push' || github.event.inputs.scope == 'all' || github.event.inputs.scope == 'functions' }}
        continue-on-error: true
        timeout-minutes: 8
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.sa.outputs.sa_path }}
          NBD_DEPLOY_SKIP_LIST: "onRepSignup"
        run: |
          set +e
          RETRY=""
          for fn in $(echo "$NBD_DEPLOY_SKIP_LIST" | tr ',' ' '); do
            RETRY="${RETRY},functions:${fn}"
          done
          RETRY="${RETRY#,}"
          echo "Attempting tolerant deploy of: $RETRY"
          npx firebase-tools deploy --only "$RETRY" --project "$PRO_PROJECT" --non-interactive --force
          EXIT=$?
          if [ $EXIT -ne 0 ]; then
            {
              echo "### ⚠ Some scheduled / blocking-trigger functions couldn't update"
              echo ""
              echo "The GitHub Actions deploy service account is missing either"
              echo "\`roles/cloudscheduler.admin\` or \`roles/identityplatform.admin\`"
              echo "(or both). The following functions were NOT updated this deploy:"
              echo ""
              for fn in $(echo "$NBD_DEPLOY_SKIP_LIST" | tr ',' ' '); do
                echo "  - $fn"
              done
              echo ""
              echo "Their last-deployed revisions are still live in Cloud Run."
              echo "Grant the missing IAM roles to unstick them — runbook:"
              echo "POST_DEPLOY_CHECKLIST.md §16."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::Scheduled/blocking functions deferred — see summary"
          else
            echo "✓ All previously-IAM-blocked functions deployed cleanly. Remove NBD_DEPLOY_SKIP_LIST in the workflow."
          fi
          exit 0

      - name: Wipe service-account JSON from runner
        if: always()
        run: rm -f "${{ steps.sa.outputs.sa_path }}"

      - name: Deploy summary
        if: success()
        run: |
          {
            echo "### ✓ Firebase deploy complete"
            echo ""
            echo "| Component | Project | Status |"
            echo "|---|---|---|"
            echo "| Firestore rules | $PRO_PROJECT | deployed |"
            echo "| Storage rules | $PRO_PROJECT | deployed |"
            echo "| Cloud Functions | $PRO_PROJECT | deployed |"
            echo "| Hosting | $PRO_PROJECT | deployed |"
            echo ""
            echo "Next: run \`./scripts/verify-deploy.sh\` against the live URLs to confirm the smoke tests pass."
          } >> "$GITHUB_STEP_SUMMARY"
