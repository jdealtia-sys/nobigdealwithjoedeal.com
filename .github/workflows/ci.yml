name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke-tests:
    name: Smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      # Most smoke tests are dependency-free, but the photo-vision sanitizer
      # test does a real `require()` of functions/photo-vision.js, which
      # itself pulls in firebase-functions/v2/https. Install functions deps
      # so that require resolves.
      - name: Install functions deps
        run: |
          cd functions
          if [ -f package-lock.json ]; then
            npm ci --silent || npm install --silent --no-audit --no-fund
          else
            npm install --silent --no-audit --no-fund
          fi
      - name: Run smoke tests
        run: node tests/smoke.test.js
      # Security-sensitive privilege-escalation / cross-tenant guard logic
      # (requireTeamAdmin, callerMayManageTarget, normalizeRole, classifyClaims).
      # Previously local-only (npm run test:teamroles) — gated here so a future
      # edit can't silently re-open a fail-open hole or over-block a solo owner.
      - name: Run team/role + tenant guard tests
        run: node tests/team-roles.test.js
      # /photos canonical-timestamp gate: every write path must stamp
      # createdAt and both chronological queries must orderBy it (with
      # the matching composite indexes), or quick-upload / annotation
      # photos silently vanish from the feed + gallery. Dependency-free.
      - name: Run photos timestamp contract tests
        run: node tests/photos-timestamp-contract.test.js
      # Money-path gate (H3): the Stripe payment-link reconciliation must add a
      # sales-tax line and refuse to issue any link that wouldn't charge
      # invoice.total. Dependency-free logic mirror of functions/stripe.js.
      - name: Run Stripe payment-link tax reconciliation tests
        run: node tests/stripe-payment-link-tax.test.js
      # Money-path gate: approved/partial insurance supplements must fold into
      # invoice subtotal + total (tax-exempt, own line items) or invoices on
      # supplemented jobs undercharge by the approved amount. Dependency-free
      # require() of docs/pro/js/invoice-pipeline.js pure helpers.
      - name: Run invoice-pipeline supplement folding tests
        run: node tests/invoice-pipeline.test.js
      # Money-path gate: the customer-invoice payment reconciliation
      # (invoiceWebhook payment_intent.succeeded) must credit cumulatively,
      # flip to 'paid' ONLY at zero balance, and treat a replayed paymentIntent
      # as a no-op — a re-run double-credit over-pays the invoice / wrongly
      # marks a partial paid. Also guards the owner-mismatch metadata defense.
      # Dependency-free logic mirror of the runTransaction block in stripe.js.
      - name: Run invoice-payment reconciliation tests
        run: node tests/invoice-payment-webhook.test.js
      # Pipeline forecast gate: the empirical engine derives per-tenant
      # P(win | reached stage) from stageHistory[] and Bayesian-shrinks it
      # toward the industry prior. Guards the aggregation (resolved-only rates,
      # terminal-stage exclusion), the shrinkage math, and completed-occupancy
      # velocity — all money-facing pipeline numbers. Dependency-free require().
      - name: Run empirical forecast engine tests
        run: node tests/forecast-empirical.test.js
      # Anti-relay gate: the estimate-email trigger is guarded by two sliding
      # daily caps — 3/day/recipient + a 100/day (env-overridable) global
      # backstop — so the public estimate funnel can't be turned into a
      # domain-authenticated open relay. Both fail OPEN; the sentinel doc id
      # must not be a Firestore-reserved /__.*__/ id (which, failing open,
      # would silently disable the global cap). Dependency-free logic mirror.
      - name: Run estimate-email cap tests
        run: node tests/estimate-email-cap.test.js
      # Money-path gate: the customer-portal estimate export must map pre-sweep
      # V2 rows (rate/total = internal COST basis) to retail prices — never
      # print the contractor's cost/margin to the homeowner. Dependency-free
      # require() of docs/pro/js/customer-estimate-rows.js.
      - name: Run customer-portal retail line-item tests
        run: node tests/customer-estimate-rows.test.js
      # Theme legibility + completeness gate (audit Phase 3): every theme in both
      # registries must define the required vars and clear the WCAG contrast floor
      # as rendered. Dependency-free; extracts the real engine colour helpers.
      - name: Run theme QA
        run: node tests/theme-qa.test.js
      # CRM theme-defect invariants (2026-07-19 visual audit): the guessed-token
      # landmines (--h/--text/--surface/--muted white-on-white in light mode),
      # toast-collision scoping, banner z-index ladder, and the guessed-token
      # regression guard. Dependency-free string/regex assertions over the
      # rendered CSS/JS. Was local-only until now — gated so a revert can't
      # silently re-open the light-mode legibility holes.
      - name: Run CRM theme contract tests
        run: node tests/crm-theme-contract.test.js
      # Document render + multi-tenant brand-isolation gate: every doc type renders
      # without error and never leaks one tenant's brand into another's output.
      - name: Run docgen render + tenant-isolation tests
        run: node tests/docgen-render.test.js
      # DocPreflight ↔ renderer data contract: the modal and the renderers use
      # divergent key vocabularies; hydrateDerivedFields must bridge them so a
      # rep's entered value (carrier, payment amounts, job total, scope, dates…)
      # actually reaches the rendered legal document instead of a fabricated default.
      - name: Run docgen preflight-contract tests
        run: node tests/docgen-preflight-contract.test.js
      # T-4 AI-texting persona gate: the customizable persona (presets,
      # trait sliders, identity, free-text notes) must NEVER strip or
      # weaken the locked HARD-RULES guardrails — incl. against hostile
      # custom instructions / forged section headers. Dependency-free
      # (pure functions/handlers/ai-persona.js, no firebase imports).
      - name: Run AI-texting persona prompt tests
        run: node tests/ai-persona-prompt.test.js

      # Locks in the high-value fixes from the 2026-06-25/26 surface sweeps
      # (Vault #776, Close Board #777, Storm Center #778/#779, Academy #780) so
      # a silent revert is caught. Dependency-free (vm + fake-DOM sandboxes).
      - name: Run sweep regression tests
        run: node tests/sweep-regression.test.js

      # Storm proof (idea #1 Phase 2): the verify logic must only mark a proof
      # verified at/above the 0.75" NWS severe-hail floor (never overclaim
      # damage the data doesn't support), carry userId/companyId so the frozen
      # storm_proofs read rule can gate it, and the per-lead card-detail button
      # must reference a registered dispatch target (no dead control).
      # Dependency-free require() of functions/storm-proof-logic.js + static guard.
      - name: Run storm-proof verify + wiring tests
        run: node tests/storm-proof.test.js

      # Voice→CRM consumer: the transform that turns a call summary into tasks /
      # insurance backfill must NEVER overwrite a rep-entered insurance field
      # (fills blanks only) and must turn a relative/garbage `when` into an
      # undated task, never a wrong due date. Dependency-free require() of
      # functions/voice-consumer-logic.js (shared verbatim by the trigger).
      - name: Run voice-consumer transform tests
        run: node tests/voice-consumer.test.js

      # Adjuster-tactic board (idea #2 follow-up): the company-wide rollup must
      # tally objections/red-flags per carrier AND per adjuster (the association
      # voiceConsumer drops), dedup within a call, rank carriers by call volume,
      # count distinct adjusters, and never throw on malformed summaries.
      # Dependency-free require() of functions/adjuster-board-logic.js.
      - name: Run adjuster-board aggregation tests
        run: node tests/adjuster-board.test.js

      # ...and the card must actually SURVIVE on screen (QA 2026-07-29). The
      # whole adjuster board was built — logic, callable, card, render call —
      # and showed nothing: analytics-kpi.js owns #analyticsContainer and writes
      # innerHTML twice per render, re-appending only the AI-texting card, so
      # the adjuster card was wiped on every visit; and the card script was
      # missing from dashboard.legacy.html while the SHARED dispatcher calls it
      # behind a truthiness guard. Generic: discovers every card that injects
      # into that container, so the next one can't repeat this.
      - name: Run analytics-container re-mount + parity tests
        run: node tests/analytics-container-remount.test.js

      # AI-draft channel fork: an inbound_sms draft must NEVER be misrouted as a
      # portal draft (keeps the live Twilio send path byte-identical), and only
      # the explicit portal trigger types deliver to the portal thread. A false
      # positive silently diverts a customer SMS; a false negative texts a
      # portal reply. Dependency-free require() of functions/ai-draft-routing.js.
      # County policy is per-TENANT (migrated off per-device localStorage
      # 2026-07-29): the canonical-7 permit costs + tax rates now live in
      # companyProfile.pricing and are overlaid at every county-resolving entry
      # point, so one estimate cannot price differently depending on which path
      # computed it. Also pins the money fail-safes (a blank/garbage tenant value
      # must never zero a permit or a tax rate) and that reset clears company
      # policy rather than just this device.
      # Stripe Connect Express — the pure money decisions (phases 1 + 3).
      # MONEY-PATH gate: capability booleans must FAIL CLOSED (a garbage/absent
      # value must never read as "charges enabled"), two admins must not mint two
      # connected accounts, an out-of-order or TEST-mode account.updated must not
      # flip LIVE state, and requirement VALUES (SSN-class PII) must never be
      # mirrored into Firestore. Phase 3 (2026-07-3x) added the arithmetic that
      # touches a contractor's bank account: platformFeeCents must never exceed
      # the charge and must fail closed on anything that isn't integer cents;
      # decideDisputeReversal must recover the disputed amount and never MORE
      # than the transfer holds; connectTestModeAllowed must be a strict '1'.
      # Containment moved rather than lifted: the money primitives now live in
      # functions/stripe.js and NOWHERE else — the handler and the logic module
      # stay accounts-only, pinned from both sides (see the platform-only step).
      # Dependency-free require() of the logic module.
      - name: Run Stripe Connect phase-1 tests
        run: node tests/stripe-connect.test.js

      # Connect Settings → Billing card. CAPABILITY TRUTH is the point now that
      # phase 3 lifted the #1123 gate (2026-07-3x): the card is reachable by
      # owner OR company_admin — mirroring the server's requireTeamAdmin, so
      # nobody is shown a button that 403s — and it renders what the account can
      # actually do: "Online card payments are ON" only inside the
      # onlinePaymentsEnabled branch, "not switched on" otherwise, and the
      # 3.4% + 30c price in BOTH (a fee first learned about from a payout is a
      # fee we hid). Couplings fail LOUDLY in both directions: gate lifted but
      # card owner-only = charging tenants for something they can't manage; card
      # widened but gate closed = asking for an SSN for nothing; fee charged but
      # undisclosed on terms/pricing/index/landing = undisclosed pricing. Also
      # pins the template re-execution guards (this script runs twice), the
      # deep-link tab ALLOWLIST (an unknown tab blanks the whole Settings
      # screen), callable-SDK use (enforceAppCheck ⇒ a raw fetch 401s), and that
      # the single-use AccountLink is never persisted.
      - name: Run Stripe Connect phase-2 UI tests
        run: node tests/stripe-connect-ui.test.js

      - name: Run county tenant-policy tests
        run: node tests/county-tenant-policy.test.js

      - name: Run AI-draft routing tests
        run: node tests/ai-draft-routing.test.js

      # Portal AI reply (emulator QA 2026-07-29): the AI draft must see the
      # HOMEOWNER PORTAL thread — it read only sms notes, so every portal draft
      # was generated as a cold first contact and the persona re-introduced
      # itself on every message — and an AI-approved portal reply must perform
      # the same mark-read / lead-bump / timeline side effects as a human rep
      # reply (it did none of them: permanent unread badge, lead read as
      # unanswered forever, and the AI stayed blind to its own prior replies).
      - name: Run portal AI reply tests
        run: node tests/portal-ai-reply.test.js

      # Roof Report generator: the homeowner-facing HTML is served to a
      # logged-out homeowner, so every record/brand field MUST be escaped
      # (stored-XSS + brand-injection source) and it must NEVER leak the rep's
      # internal project value / owner market value / cost-margin, nor issue a
      # damage verdict. Dependency-free require() of the pure generator.
      - name: Run roof-report generator tests
        run: node tests/roof-report.test.js

      # Roof Report WIRING (QA 2026-07-29): the generator was fine, but the 📄
      # button needs InspectionReportEngine, which ships in the LAZY photos
      # bundle. The property-intel card is a modal reachable from anywhere, and
      # dashboard-actions installs a TRUTHY placeholder with no saveReport — so
      # shareRoofReport bailed with "engine not ready" on any session that had
      # not already opened Photos. Pins the bundle load, the stub-vs-real check,
      # and the post-load re-read (same class as photo-hub-engine).
      - name: Run roof-report wiring tests
        run: node tests/roof-report-wiring.test.js

      # Inbound-SMS convert: the builder that turns an untrusted unmatched_sms
      # row into a lead must always stamp the converting admin's userId/companyId
      # (never a null-tenant lead), carry phoneDigits for re-matching, clamp the
      # attacker-controlled body into notes, and land in the canonical 'New'
      # stage. Dependency-free require() of functions/inbound-sms-convert-logic.js.
      - name: Run inbound-SMS convert builder tests
        run: node tests/inbound-sms-convert.test.js

      # Buying-intent strike: the fresh-view predicate must fire only for a
      # live viewer (≤6h, unresponded, non-terminal lead) and never nag on a
      # closed/deleted deal — a false strike sends a rep to call a done deal.
      # Dependency-free require() of the pure detectFreshViews().
      - name: Run buying-intent strike detection tests
        run: node tests/buying-intent-strike.test.js

      # Real-time fresh-view push (idea #3 Phase 2): the trigger's notification
      # builder must always key the strike to the owner's feed + degrade to a
      # generic message, the cooldown must suppress the estimate_view refresh
      # burst but let a genuine later re-open re-fire, and the client predicate
      # must fire ONLY on a fresh estimate_viewed notif with a parent lead
      # (keyed by estimateId so it dedupes against the estimates-cache path).
      # Dependency-free require() of functions/fresh-view-logic.js + the pure
      # buying-intent-strike.js predicate.
      - name: Run fresh-view strike tests
        run: node tests/fresh-view-strike.test.js
      # Inbound-SMS triage: the classifier must UNDER-filter — a real inbound
      # lead hidden as spam is a lost deal, a shown carrier keyword is a shrug.
      # Guards that only unambiguous noise (empty / opt-out / carrier keyword)
      # is set aside and the inbox stays newest-first. Dependency-free require().
      - name: Run inbound-SMS triage tests
        run: node tests/inbound-sms-triage.test.js

      # Semantic-role foundation (freeform-pipeline Phase 0): proves
      # stageRole()/isWonStage() reproduce the legacy WON_STAGES/LOST_STAGES
      # behaviour exactly, so the KPI/money/leaderboard consumers migrated to
      # role checks can't drift revenue / close-rate.
      - name: Run crm-stages role tests
        run: node tests/crm-stages-roles.test.js

      # Server mirror of the semantic roles (freeform pipelines Phase 3): the
      # referral payout + portal progress bar classify by role so tenant CUSTOM
      # stages work server-side. Guards functions/stage-roles.js vs the client.
      - name: Run server stage-roles tests
        run: node tests/stage-roles.test.js

      # Hidden-stage bucketing (#921 QA follow-up): leads whose stage is
      # eye-toggled off must land in partitionLeadsByColumn's `hidden` bucket
      # (surfaced via the board chip), never rebucketed into column 1.
      - name: Run hidden-stage bucketing tests
        run: node tests/hidden-stage-bucketing.test.js

      # Estimate money ladder: estimates exist in two shapes (V2 grandTotal /
      # Classic amount|total), and Classic is what the customer page's Log
      # Estimate flow writes. Reading grandTotal alone scored every Classic doc
      # 0 — which stamped lead.jobValue to $0 (the number the kanban, KPIs and
      # leaderboard all read) and wrote `total: 0` invoice docs to Firestore.
      # Pins the reader contract AND statically guards the money-bearing files,
      # because a missing ladder rung is invisible to any test fed only V2 docs.
      - name: Run estimate money-ladder tests
        run: node tests/estimate-money-ladder.test.js

      # Photo hub vs the lazy PhotoEngine placeholder: dashboard-actions.js
      # installs `window.PhotoEngine = { __nbdLazyPhotosStub: true, … }` to mean
      # "bundle not loaded yet". The hub tested bare truthiness, accepted it as
      # the engine, and so never loaded the real one — ⬆ Upload locked on
      # "Uploading…" and dropped files 2..N, while Delete and the tag chips
      # no-op'd permanently. Also pins batch lead-pinning (photos were filed
      # under whichever customer was on screen when each .then RAN), fresh-upload
      # ordering, phase-on-tag-edit, and idempotent cache seeding.
      - name: Run photo-hub engine tests
        run: node tests/photo-hub-engine.test.js

      # customer.html tenant claims + companyId stamping: window._userClaims is
      # written by three dashboard-side files, NONE loaded on customer.html, so
      # every team-scoped reader there silently took the owner-only branch — a
      # manager saw empty Invoices / Comm Log / photos, understated job costs,
      # and a false read-only banner. Also pins companyId on the two writers
      # that omitted it (/reports create REQUIRES it -> every save rejected
      # behind a success toast; customer-page Log Estimate was invisible to the
      # whole team). Dependency-free.
      - name: Run customer-page claims + companyId tests
        run: node tests/customer-page-claims.test.js
      # Dead-control tail: six controls whose dependency lived on a different
      # page or inside a lazy bundle nobody requested — command-palette targeting
      # a global (openCardDetail) that has never existed, drag-drop upload and
      # Xactimate catalog search bailing instead of loading their bundle, maps
      # "Load from Customer" calling a redrawAll() that does not exist, and the
      # stage-email toast building HTML for a textContent renderer.
      - name: Run dead-control tail tests
        run: node tests/dead-controls-tail.test.js

      # Estimate hub controls: the per-customer hub labelled a deleteDoc() call
      # "🗄 Archive" (an archive box = filed away, recoverable), and routed ⎘ Copy
      # through the generic duplicate that nulls leadId — so the copy was
      # filtered straight out of a hub that lists BY leadId, behind a success
      # toast. Pins label honesty, that the action is still the real delete, and
      # that the dashboard's own unassigning default is unchanged.
      - name: Run estimate-hub control tests
        run: node tests/estimate-hub-controls.test.js

      # Empty-tenant first run: the load-status banner gated success on
      # (loaded && count > 0), so an account with ZERO leads — i.e. every brand
      # new signup — got a persistent "Data not loaded" error pill with a Retry
      # button on its very first dashboard, while the load had in fact succeeded.
      # Invisible to anyone with data, which is why it shipped. Also pins the
      # ?v= cache-bust, without which warm caches keep serving the broken file.
      - name: Run empty-tenant load-banner tests
        run: node tests/empty-tenant-load-banner.test.js

      # Empty-is-not-failed (companion to the load-status banner fix): the CRM
      # entry was gated on lead COUNT, so a zero-lead tenant got no kanban
      # columns at all, and the diagnostic panel keyed off count instead of the
      # error — telling every new signup "Your kanban isn't loading" over a dump
      # of their Firebase UID. Pins that the board renders empty, the friendly
      # branch leaks no diagnostics, and the failure branch keeps its tools.
      - name: Run empty-is-not-failed tests
        run: node tests/empty-is-not-failed.test.js

      # MONEY CUSTODY GATE. The original premise — a tenant's payment link
      # settles their HOMEOWNER's money into the PLATFORM's balance (our
      # chargebacks, our 1099-K, collecting funds on behalf of other businesses)
      # — was fixed by Connect phase 3 (2026-07-3x), exactly the deliberate
      # rewrite this comment used to ask for. What the suite pins now:
      # CONFINEMENT (the money primitives live in functions/stripe.js and
      # nowhere else under functions/, never inside the four subscription-billing
      # exports, never in the two Connect files); the THREE-WAY GATE in
      # createStripePaymentLink (platform tenant mints as before; a capable
      # tenant with a live subscription — past_due included — mints a
      # destination charge; everyone else gets a 403 returned BEFORE any Stripe
      # call); the CLIENT MIRROR failing closed; and that esign C5 auto-invoices
      # were deliberately NOT ported and stay platform-only.
      - name: Run Stripe platform-only payment tests
        run: node tests/stripe-platform-only-payments.test.js

      # Server PDF brand fallback: resolveDocCompany returned the OWNER's identity
      # (logo, legal name, phone, jd@ email, 'Joe', NBD seal) for every unresolved
      # case — including a missing companyProfile, which is reachable because
      # provisioning is best-effort. A tenant got Joe's name on contracts a
      # homeowner signs. Reserved for the platform tenant; everyone else neutral.
      - name: Run render-pdf neutral-fallback tests
        run: node tests/render-pdf-neutral-fallback.test.js

      # Widgets must not invent data: the Team Leaderboard rendered three fake
      # reps (Joe Deal $48.5k) and Material Price Watch four fake shingle prices
      # a roofer could quote a real job from. Both opt-in from an ungated picker.
      - name: Run widget fabricated-data tests
        run: node tests/widgets-no-fabricated-data.test.js

      # Portal-link minter: portal-link-helpers.js ships on customer.html AND
      # both dashboards, but the two page families expose different minters
      # (CustomerPortal.mintUrl vs _mintPortalUrl). Requiring only the former
      # made every portal affordance on the dashboards throw 'Portal module not
      # loaded' — the kanban context menu, activity feed, global search, notif
      # bell, three widgets, smart-followup + briefing, and the bootstrap.
      # Drives the real module in a fake-DOM sandbox under each page shape,
      # and pins the script tags both minters depend on. Dependency-free.
      - name: Run portal-link minter tests
        run: node tests/portal-link-minter.test.js

      # Quick-action bar Comm Log: crm-snooze.js's capture-phase tel:/sms:/mailto:
      # logger is NOT loaded on customer.html, so taps on the mobile quick-action
      # bar reached the timeline from nowhere — a rep could call a customer and
      # later find no record of it. Pins BOTH halves of the correct fix: the tap
      # logs, AND the buttons stay sms:/mailto: anchors (an earlier attempt wired
      # Text to PortalLinkHelpers.smsForLead, which POSTs to Twilio with no
      # preview — an unreviewed message to a homeowner behind a "Text" button).
      # Drives the real module in a fake-DOM sandbox. Dependency-free.
      - name: Run quick-action-bar comm-log tests
        run: node tests/qab-comm-log.test.js

      # Stranger-gauntlet Fix Batch 1 (2026-07-16): invite-claim flag scoping,
      # past_due seat entitlement, company-keyed AI billing reads, invitee
      # register bypass, letterhead tagline gate, @stranger-required CI shape.
      # Requires functions deps (imports invites.js _test.seatLimitForPlan) —
      # this job installs them below for the smoke suite already.
      - name: Run gauntlet regression tests
        run: node tests/gauntlet-regressions.test.js

      # CSP/security-header invariants, the GDPR erasure/export registry, AND
      # the internal-doc publication guard. Was authored as a test file but
      # never wired into CI, so none of it actually gated anything — which is
      # how all 16 ops runbooks under docs/deploy/ stayed publicly served
      # (hosting.public is "docs", so docs/ IS the site root). Gated here so a
      # future commit can't re-open unsafe-inline, drop a PII collection from
      # the erasure registry, or drop a runbook into a served path.
      - name: Run security-header + GDPR + internal-doc publication tests
        run: node tests/security-headers-gdpr.test.js

      # Catalog cost privacy. docs/ is hosting.public AND this repo is public,
      # so product-data.js shipped wholesale COST beside retail SELL for 187
      # SKUs (a computable margin on every product) plus the overhead/margin
      # policy, and roofivent-catalog.js shipped a supplier's confidential
      # contractor price list. Same two-surface shape as the runbook leak
      # (#1147 hosting → #1149 repo) — and those were one company's supplier
      # terms, seeded onto every other tenant. Costs are now tenant-owned
      # (catalogCosts/{companyId}); these two suites keep them there.
      # privacy = the leak guard (structural + signature + strict scans, each
      # mutation-tested). seed = the behaviour (lossless split, the
      # sell >= cost > 0 invariant, the hydration path's tombstone/user-edit
      # semantics, and "cost not set" never rendering as a 100% margin).
      - name: Run catalog cost privacy guard
        run: node tests/catalog-cost-privacy.test.js
      - name: Run catalog cost seed + hydration tests
        run: node tests/catalog-cost-seed.test.js
      # Catalog integrity + the product-library DATA_VERSION migration. Was
      # local-only; gated here because the cost split touches both.
      - name: Run product catalog + library migration tests
        run: node tests/product-data.test.js
      # Regression tripwire for the 2026-07-30 public-surface sweep
      # (#1147/#1149/#1150). hosting.public is "docs", so docs/ IS the site
      # root; the fixes there had to EDIT files the CRM loads at runtime,
      # which no hosting.ignore glob can protect. This pins the specific
      # strings that leaked — third-party PII in comments, the private Worker
      # hostname, supplier branch + portal-cost provenance, "plan gating is
      # fake", operator TODOs — so they cannot quietly come back.
      # Mutation-tested in five shapes; each failure names file:line.
      - name: Run public-surface leak tripwire
        run: node tests/public-surface-leak-tripwire.test.js

      # ── Orphaned-suite wiring (2026-08-05) ─────────────────────────────
      # The 12 suites below existed and passed locally but ran NOWHERE — not
      # in the tests/package.json chain, not in CI. Several guard money and
      # legal paths. Wired here in stakes order; each is dependency-free
      # (node tests/<file>) unless noted. If one goes red only in CI, fix
      # the step environment before touching the test.

      # A signed contract must be verified against the document we served,
      # and the original must survive. Pins stripSignatureBlocks/visibleText/
      # signedDocMatchesOriginal in functions/remote-signing.js (#1173).
      - name: Run signature document integrity tests
        run: node tests/signature-document-integrity.test.js

      # Referral source-customer lookups must stay scoped to one tenant and
      # refuse when ambiguous (#1172). Extracts the real block from
      # functions/referrals.js — an anchor drift fails loudly, not silently.
      - name: Run referral tenant-scope tests
        run: node tests/referral-tenant-scope.test.js

      # enforceAppCheck is onCall-only; on onRequest it is dead config that
      # reads as protection (#1170). Scans functions/ so it can't come back.
      - name: Run App Check onRequest contract tests
        run: node tests/appcheck-onrequest-contract.test.js

      # Public-lead → CRM mirror logic (tenant routing, phone normalization).
      # functions/lead-bridge-logic.js is deliberately firebase-free.
      - name: Run lead-bridge logic tests
        run: node tests/lead-bridge.test.js

      # Money fields: cost vs retail must never swap or leak across surfaces.
      - name: Run money field contract tests
        run: node tests/money-field-contract.test.js
      - name: Run money display consumer tests
        run: node tests/money-display-consumers.test.js

      # Homeowner portal + remote signing must render the TENANT's brand,
      # never the platform's (the Pillar-2 "NBD bleed" rule).
      - name: Run portal white-label contract tests
        run: node tests/portal-whitelabel-contract.test.js

      # Drives the real PipelineBuilder delete path in a fake-DOM sandbox.
      - name: Run pipeline-builder delete tests
        run: node tests/pipeline-builder-delete.test.js

      # nbd-comms platform wiring (SMS/email surfaces).
      - name: Run nbd-comms platform tests
        run: node tests/nbd-comms-platform.test.js

      # Login must persist plan intent through the auth flow (source contract
      # over docs/pro/js/pages/login.js).
      - name: Run login plan-intent tests
        run: node tests/login-plan-intent.test.js

      # Job templates: vm-loads the three real job-templates modules.
      - name: Run job template tests
        run: node tests/job-templates.test.js

      # 2026-07-19 CRM-loop sweep certification (intro-video data-yt guard,
      # estimate-email kill switch). Its git branch-report section is
      # try/catch-wrapped and degrades harmlessly under fetch-depth:1.
      - name: Run CRM loop-complete tests
        run: node tests/crm-loop-complete.test.js

      # Audit P6 (2026-08-05): a honeypot NAMED "website" matches browser
      # URL-autofill heuristics — autofill fills it on a real homeowner's
      # form and the gateway swallows the lead with a fake success. Pins the
      # nbd_hp rename on every emitter + the both-keys gateway check.
      - name: Run honeypot autofill contract tests
        run: node tests/honeypot-autofill-contract.test.js

  site-integrity:
    name: Site integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      # Gate the defect classes the 2026-06 manual QC sweep fixed by hand:
      # dead internal links, 404'd assets, broken in-page/cross-page anchors.
      # Zero npm deps (Node builtins only) — no install step needed.
      # firebase.json redirects/rewrites are read at runtime, so hosting
      # config changes can't desync the checker.
      - name: Check links, assets, and anchors (docs/, excluding /pro + /admin)
        run: node scripts/check-site-integrity.js --quiet
      # Sitemap drift gate: build-sitemap.js dry-runs by default and exits 1
      # when the generated sitemap differs from docs/sitemap.xml (prints the
      # unified diff). Writes nothing without --write.
      - name: Check sitemap drift (dry-run diff)
        run: node scripts/build-sitemap.js
      # Feed drift gate: build-feed.mjs dry-runs by default and exits 1 when
      # the generated RSS feed differs from docs/feed.xml (same POSTS source
      # and live-post filter as the blog index, deterministic timestamps).
      - name: Check feed drift (dry-run diff)
        run: node scripts/build-feed.mjs
      # Featured Projects drift gate: the OURWORK-* regions in docs/our-work.html
      # are generated from assets/data/projects.json. Same rationale as the
      # partial gate below — without this the scheme is advisory.
      - name: Check projects static-block drift (dry-run diff)
        run: node scripts/build-projects.mjs --check
      # Shared-partial drift gate. The chrome inside <!-- nbd:partial --> markers
      # is GENERATED from site-src/partials/. Without this gate the whole scheme
      # is advisory: a page could be hand-edited inside a region, or a partial
      # could be changed without restamping, and nothing would notice — which is
      # exactly how 139 pages ended up claiming the wrong city. Writes nothing
      # with --check; exits 1 and prints the offending file + region.
      - name: Check shared-partial drift (site-src/partials vs docs/)
        run: node scripts/apply-partials.js --check --diff
      # Inline-script gate. BIG_ROCKS.md names this checker a must-pass, but
      # neither the checker nor its test ran anywhere in CI (2026-08-05).
      # The checker guards the served pages; the test guards the checker.
      - name: Check inline HTML scripts (docs/)
        run: node scripts/check-inline-html-scripts.js
      # Image-privacy gate (2026-08-10): published images must carry no EXIF
      # GPS — three gallery JPEGs shipped with customer-property coordinates
      # because nothing verified the committed bytes after
      # prepare-project-images.mjs was bypassed. Zero deps, byte-level scan.
      - name: Check image privacy (EXIF/GPS strip invariant)
        run: node scripts/check-image-privacy.js
      - name: Run inline-html-scripts checker tests
        run: node tests/inline-html-scripts.test.js
      # Marketing-surface polish contract (headings, empty src, alt text …)
      # over the served docs/ pages — same zero-install shape as this job.
      - name: Run marketing polish contract tests
        run: node tests/marketing-polish-contract.test.js
      # Icon-CSS link contract (2026-08-07): every page using svg.ico /
      # svg.nav-ico must link the shared /assets/css/nbd-icons.css (the old
      # per-page injected <style> duplicated ~1.1 KB × 185 pages).
      - name: Check icon-CSS links (assert mode)
        run: node scripts/ensure-icon-css.js
      # Nav-CSS block contract (2026-08-17): every page with header-nav markup
      # (dropdown-menu / mobile-nav / hamburger) must carry the "nav base
      # (injected)" style block. 18 hand-built pages (the-pledge, areas index,
      # 7 product pages, 9 blog posts) shipped without it — the Services
      # dropdown rendered permanently expanded over the page header and the
      # mobile hamburger/collapse never worked.
      - name: Check nav-CSS blocks (assert mode)
        run: node scripts/ensure-nav-css.js
      # Manifest completeness tripwire (2026-08-07): every tests/*.test.js
      # must be classified in tests/ci-manifest.json — a new suite that isn't
      # bucketed fails here instead of silently never running (35 suites,
      # including every money/pricing suite, were orphaned this way).
      - name: Check test-suite manifest completeness
        run: node scripts/run-test-manifest.js --check

  # The 32 node suites the manifest owns (2026-08-07). These existed for
  # months without gating anything — tests/package.json's `npm test`
  # aggregate was never invoked by CI, and nobody hand-listed them. All 32
  # verified green at wiring time; quarantine (with a dated reason in the
  # manifest) rather than wiring red.
  unit-suite-manifest:
    name: Unit suites (manifest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      # Most of the bucket is dependency-free, but expenses-logic requires
      # functions/receipt-vision.js (→ firebase-functions) and
      # webhook-signatures requires functions/node_modules/stripe by path —
      # same rationale as the smoke-tests job's install.
      - name: Install functions deps
        run: |
          cd functions
          npm ci --silent || npm install --silent --no-audit --no-fund
      - name: Run manifest node bucket
        run: node scripts/run-test-manifest.js

      # Behavioral tests for the strict functions-deploy step in
      # firebase-deploy.yml — it is shell inside YAML, so nothing else can
      # actually execute it. Three false-green modes have shipped from that
      # step, two of them found by deploying to prod and noticing afterwards.
      # Dependency-free, no network, no credentials, runs in seconds; it
      # extracts the real run: block and drives it against a stand-in CLI.
      # Rides this job rather than its own because it needs neither the deps
      # installed above nor a runner of its own.
      # See tests/deploy-step/README.md.
      - name: Deploy-step guards (false-green regressions)
        run: bash tests/deploy-step/run.sh

  # The three auth/firestore-emulator suites the manifest classifies as
  # emulator-bucket (2026-08-07; the fourth, portal-token, rides the
  # referral-trigger job's functions-emulator recipe). Same v13 global
  # firebase-tools shape as the firestore-rules job — none boots functions.
  emulator-orphan-suites:
    name: Auth/Firestore emulator suites (rate-limit, auth-access, lead-lifecycle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-java@v5.6.0
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Install test deps
        run: |
          cd tests
          npm install --silent
      # rate-limit.test.js drives functions/rate-limit.js directly, which
      # requires firebase deps from functions/node_modules.
      - name: Install functions deps
        run: |
          cd functions
          npm ci --silent || npm install --silent --no-audit --no-fund
      - name: Install firebase-tools globally
        run: npm install -g firebase-tools@13
      - name: Run rate-limit persistence tests under firestore emulator
        run: |
          cd tests
          firebase emulators:exec --only firestore --project nbd-test-ratelimit 'node ./rate-limit.test.js'
      - name: Run auth-access matrix tests under auth+firestore emulator
        run: |
          cd tests
          firebase emulators:exec --only auth,firestore --project nbd-test-authaccess 'node ./auth-access.test.js'
      - name: Run lead-lifecycle tests under auth+firestore emulator
        run: |
          cd tests
          firebase emulators:exec --only auth,firestore --project nbd-test-leadlifecycle 'node ./lead-lifecycle.test.js'

  syntax-check:
    name: Node syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      # Parse-checks every FIRST-PARTY shipped .js under functions/ + docs/.
      #
      # This used to be an inline `for f in $(find functions docs/pro/js ...)`
      # loop, which left ~80 shipped files unchecked by anything in CI — most
      # importantly all of docs/assets/js/inline/, the directory the CSP sweeps
      # moved every former inline <script> and on*= handler into. A syntax
      # error there renders a page dead with nothing else in CI noticing.
      #
      # The script widens coverage to all of docs/ (excluding assets/vendor,
      # _archive, node_modules), and is ~6x faster than the serial loop because
      # it runs a CPU-sized pool instead of one blocking spawn per file. It is
      # also reused verbatim as the pre-Hosting gate in firebase-deploy.yml.
      - name: Parse every shipped first-party .js
        run: node scripts/check-js-syntax.js

  firestore-rules:
    name: Firestore rules tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install test deps
        run: |
          cd tests
          npm install --silent
      - name: Install firebase-tools globally
        run: npm install -g firebase-tools@13
      - name: Run Firestore rules tests under emulator
        run: |
          cd tests
          firebase emulators:exec --only firestore --project nbd-rules-test 'node firestore-rules.test.js'
      - name: Run cross-tenant isolation rules tests under emulator
        run: |
          cd tests
          firebase emulators:exec --only firestore --project nbd-xtenant-test 'node firestore-rules.cross-tenant.test.js'
      # Communication Log producer→index→consumer contract (customer page).
      # Broke silently once (log permanently empty): producers wrote neither
      # leadId nor `date` while the consumer queried {leadId, uid, orderBy date}.
      - name: Run Communication Log contract test under emulator
        run: |
          cd tests
          firebase emulators:exec --only firestore --project nbd-commlog-test 'node communication-log-contract.test.js'
      - name: Run Storage rules tests under emulator
        run: |
          cd tests
          firebase emulators:exec --only storage --project nbd-storage-test 'node storage-rules.test.js'

  # Referral-CODE $200-bonus trigger. Previously ONLY runnable by hand
  # (emulators:exec locally) — so the money-path bugs the 2026-07-08 sweep found
  # shipped unseen (#894/#897). Gated here: drives the REAL onReferralLeadWrite
  # trigger in the functions+firestore emulator, so attribution / credit-on-close /
  # tenant-scope / idempotency regressions fail the PR.
  referral-trigger:
    name: Referral trigger tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      # Firestore emulator runs on the JVM; firebase-tools needs a modern JDK
      # (same setup as the @stranger E2E shard that boots the functions emulator).
      - uses: actions/setup-java@v5.6.0
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Install test deps
        run: |
          cd tests
          npm install --silent
      - name: Install functions deps (the emulator must load the onReferralLeadWrite trigger)
        run: |
          cd functions
          npm ci
      - name: Emulator-safe functions env (dummy secrets + onRepSignup skip)
        # Writing a lead fires EVERY leads/{leadId} trigger; the ~34 secret-declaring
        # functions can't reach Secret Manager in CI (no ADC), so without overrides
        # they fail to load and wedge the work queue — onReferralLeadWrite never
        # lands. Generate a .secret.local with dummy values (auto-covers new secrets)
        # so all functions load + run; the trigger under test uses no secrets. Also
        # skip the GCIP-blocked onRepSignup (prod never runs it).
        # TURNSTILE_SECRET is deliberately excluded: a PRESENT (even dummy)
        # secret flips verifyTurnstile into configured mode, which fail-closes
        # every tokenless submitPublicLead call with 403 — the lead-bridge
        # integration test's gateway leg needs the unset-secret passthrough.
        # An unset secret loads fine under the v15 emulator (warning only).
        run: |
          grep -rhoE "defineSecret\(['\"][A-Z_]+['\"]" functions --include=*.js \
            | sed -E "s/.*defineSecret\(['\"]([A-Z_]+)['\"].*/\1=emulator-dummy/" \
            | grep -v '^TURNSTILE_SECRET=' \
            | sort -u > functions/.secret.local
          echo "wrote $(wc -l < functions/.secret.local) dummy secrets"
          node tests/e2e/fixtures/ensure-emulator-env.js
      - name: Run referral-rewards trigger test under functions+firestore emulator
        # Use the tests devDependency firebase-tools (v15+, same as the @stranger
        # shard that boots functions in CI). The global v13 the firestore-only jobs
        # install does NOT read functions/.secret.local, so functions crash-loop
        # without secret access (no ADC in CI) and onReferralLeadWrite never fires.
        # v15 reads .secret.local, so all functions boot with the dummy values above.
        run: |
          cd tests
          npx firebase-tools emulators:exec --only functions,firestore --project demo-nbd-pl 'node referral-rewards.test.js'
      - name: Run lead-bridge integration test under functions+firestore emulator
        # Public lead → CRM mirror, end to end through the real trigger. Was
        # authored with this exact recipe in its RUN header but never wired
        # anywhere (2026-08-05). Reuses this job's JDK + functions deps +
        # dummy-secret env; a second emulators:exec session boots fresh.
        run: |
          cd tests
          npx firebase-tools emulators:exec --only functions,firestore --project demo-nbd-pl 'node lead-bridge.integration.test.js'

      # Public-intake gateway suite (submitPublicLead: honeypot both-keys,
      # field allowlist, contact-kind allowlist, silent-200 semantics). Ran in
      # the local chain but not CI (NEXT_SESSION-2026-08-05 item 8). Reuses
      # this job's recipe — the dummy-secret step above already excludes
      # TURNSTILE_SECRET, which this suite's tokenless legs require.
      - name: Run public-intake gateway tests under functions+firestore emulator
        run: |
          cd tests
          npx firebase-tools emulators:exec --only functions,firestore --project demo-nbd-pl 'node public-intake.test.js'

      # Portal token-surface suite (mintPortalLink → validate → revoke).
      # Manifest emulator-bucket (2026-08-07): needs the functions emulator,
      # so it reuses this job's JDK + functions deps + dummy-secret env
      # exactly like the two suites above; a fresh emulators:exec boots it.
      - name: Run portal-token tests under functions+firestore emulator
        run: |
          cd tests
          npx firebase-tools emulators:exec --only functions,firestore --project demo-nbd-portal 'node portal-token.test.js'

  functions-parse:
    name: Functions parse + dep install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Install functions deps (CI)
        # `npm ci` requires the lockfile to match package.json exactly.
        # When a feature branch adds deps but we haven't regenerated the
        # lock yet, fall back to `npm install` instead of failing CI.
        run: |
          cd functions
          if [ -f package-lock.json ]; then
            npm ci --silent || npm install --silent --no-audit --no-fund
          else
            npm install --silent --no-audit --no-fund
          fi

      # Fail the build on HIGH+ npm advisories. The known LOW and
      # MODERATE transitive advisories (see functions/NPM_AUDIT_ACCEPTED.md)
      # are below this threshold and intentionally not addressed — each
      # one is a transitive dep of firebase-admin / @google-cloud/*
      # whose vulnerable code path is unreachable from our handlers,
      # and the only available fixes are `npm audit fix --force`
      # downgrades that regress firebase-admin to 10.x (breaks
      # multi-tenant + App Check). Re-audit on every dep-review
      # sprint; any HIGH or CRITICAL is a P1.
      - name: Audit dependencies (high and above)
        run: |
          cd functions
          npm audit --audit-level=high
      - name: Require every integration module
        run: |
          cd functions
          node -e "
            const fs = require('fs');
            const files = fs.readdirSync('integrations').filter(f => f.endsWith('.js'));
            for (const f of files) {
              try {
                require('./integrations/' + f);
                console.log('OK ', f);
              } catch (e) {
                console.error('FAIL ', f, e.message);
                process.exit(1);
              }
            }
          "

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Simple grep — fast first-pass for obvious patterns. Catches
      # the big ones before a push even completes.
      - name: Grep for obvious secrets
        run: |
          set -e
          echo "== Checking for committed private keys / tokens =="
          ! grep -rE '(-----BEGIN (RSA |EC |DSA |OPENSSH )?PRIVATE KEY-----|sk_live_[A-Za-z0-9]+|sk-ant-[A-Za-z0-9-]{20,}|SG\.[A-Za-z0-9_-]{22}\.[A-Za-z0-9_-]{43}|ghp_[A-Za-z0-9]{36})' --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=_archive --include='*.js' --include='*.html' --include='*.json' --include='*.md' .

      # Q5: full gitleaks scan — catches 130+ secret formats the
      # grep above doesn't (GCP SA JSON, Slack webhook, JWTs with
      # recognizable signatures, etc.). Runs against the whole
      # history so a secret that slipped in before gitleaks was
      # wired surfaces now.
      #
      # If this starts failing on legitimate matches, add an entry
      # to .gitleaksignore with the full fingerprint line from the
      # scanner output.
      - name: gitleaks scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "true"
          GITLEAKS_ENABLE_SUMMARY: "true"

  e2e-authed-emulator:
    name: Authed E2E (emulators, ${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # '@audit' = tests/e2e/dashboard-actions-audit.spec.js — full
        # data-action wiring + mobile tap audit (2026-07-05). Its own
        # emulator session, same flake-isolation rationale as the shards.
        # '@stranger' = tests/e2e/stranger.spec.js — the Stranger Test:
        # the full second-contractor lifecycle (provision → operate →
        # microsite → team → isolation) against the FULL emulator rig,
        # functions included (2026-07-06).
        # '@gauntlet' = tests/e2e/gauntlet-lifecycle.spec.js — the e2e-debt
        # specs (persona resolution, lapse seat pause/restore, access-code
        # redemption, multi-rep own-only + seat cap). Boots functions like
        # @stranger; introduced advisory 2026-07-17, promoted to REQUIRED
        # 2026-07-28 with the rest of the matrix — see the ALL FIVE ARE NOW
        # REQUIRED note below.
        # '@engines' = tests/e2e/d2d-engine.spec.js + estimate-engine.spec.js
        # — the lazy-bundle assembly proofs (D2D shim surface, 222-product /
        # 298-key catalog snapshot). Authored with the shard recipe but never
        # wired (2026-08-07 audit). ADVISORY on introduction, same bar the
        # other five earned promotion through: prove a green streak, then
        # flip the continue-on-error expression below.
        shard: ['@shard1', '@shard2', '@audit', '@stranger', '@gauntlet', '@engines']
    # Rock 3: hermetic authed journey — seed a tenant in the Auth/Firestore
    # emulators, serve docs/ from the hosting emulator (the client SDK
    # auto-connects to emulators on localhost via nbd-emulator-connect.js),
    # and run pro-authed.spec.js against it. No prod credentials involved.
    #
    # @stranger was promoted to REQUIRED first (gauntlet 2026-07-16): it is the
    # ONLY runtime proof anywhere in CI that a stranger can self-provision
    # (register → createCompany → onboarding → claimInvite → isolation). The
    # legacy shards run functions-LESS and explicitly allowlist createCompany
    # connection-refusals, so with it advisory, a regression that bricked
    # new-tenant signup merged green.
    #
    # ALL FIVE ARE NOW REQUIRED (2026-07-28). The remaining four were held
    # advisory "until they earn the same promotion" — they have now earned it:
    # across all 60 CI runs on main since the 2026-07-08 knock→lead poll-race
    # fix (#912), @shard1, @shard2 and @audit are 60/60 green and @gauntlet is
    # 59/59 (+1 cancelled). The only shard to fail even once in that window is
    # @stranger — the one that was already blocking.
    #
    # That last documented flake class was a TEST-side race, not a product bug
    # (the poll broke on convertedToLead before the separate _saveLead
    # back-link write landed), and it was fixed at the source rather than
    # absorbed by this flag. That is the bar for promotion: fix the race, prove
    # it green, then make it blocking — not the reverse.
    #
    # Left advisory, these were worse than nothing: they burn ~5 runners a push
    # and a real regression in any of them still merges green, so the signal
    # was being produced and then discarded. To re-park a shard that starts
    # flaking, prefer fixing the race; if you must, add a per-shard exclusion
    # here and record WHY, as the @stranger promotion note above does.
    #
    # FLAKE CLASS + FIX (2026-07-05): with 16 serial journeys in ONE
    # emulator session, the Java Firestore emulator intermittently dropped
    # reads ('client is offline') and a rotating single test exhausted its
    # retries each run (#842 rounds 4-9; every deterministic failure found
    # in those rounds was a real bug and was fixed separately). The fix is
    # THIS matrix: the suite is split into @shard1/@shard2 title tags
    # (tests/e2e/pro-authed.spec.js), each shard running in its own
    # emulator session at roughly half load, selected via PLAYWRIGHT_GREP.
    # If a rotating victim reappears, split further or slim the per-test
    # dashboard boot - do NOT chase individual tests.
    # Five shards REQUIRED (2026-07-28); @engines advisory since 2026-08-07 —
    # promotion checklist lives in NEXT_SESSION-2026-08-07.md.
    continue-on-error: ${{ matrix.shard == '@engines' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      # The Firestore emulator runs on the JVM; firebase-tools 15+ (the tests
      # devDependency) requires JDK 21 — same setup as firebase-deploy.yml.
      - uses: actions/setup-java@v5.6.0
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Install test deps
        run: |
          cd tests
          npm install --silent --no-audit --no-fund
      # The Stranger Test shard boots the FUNCTIONS emulator — the emulated
      # runtime loads functions/index.js, so its dependencies must be
      # installed there (and only there; legacy shards run functions-less).
      - name: Install functions deps (functions emulator runtime)
        if: matrix.shard == '@stranger' || matrix.shard == '@gauntlet'
        run: |
          cd functions
          npm install --silent --no-audit --no-fund
      - name: Install Playwright chromium
        run: |
          cd tests
          npx playwright install --with-deps chromium
      - name: Run authed E2E against emulators
        env:
          PLAYWRIGHT_GREP: ${{ matrix.shard }}
          # The FUNCTIONS emulator boots only for the Stranger Test shard —
          # its ~140-function runtime measurably slows dashboard settle and
          # widened the documented 301-hop "execution context destroyed"
          # race in the legacy shards on the first full-rig run. The legacy
          # shards keep their tuned functions-less environment (callable
          # connection-refusals are allowlisted there); widening functions
          # to all shards is future work once boot cost is addressed.
          NBD_EMU_FUNCTIONS: ${{ (matrix.shard == '@stranger' || matrix.shard == '@gauntlet') && '1' || '' }}
        run: |
          cd tests
          npm run test:e2e:authed:emu
      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-authed-traces-${{ strategy.job-index }}
          path: tests/test-results/
          retention-days: 7

  # Public-surface E2E (2026-08-07 audit): marketing.spec.js + pro-public.
  # spec.js existed with a ready-made npm script but were wired NOWHERE.
  # CRITICAL RECIPE NOTE: tests/playwright.config.js defaults baseURL to
  # PRODUCTION — PLAYWRIGHT_BASE_URL must stay pinned to the hosting
  # emulator here or this job smoke-tests the live site. Advisory on
  # introduction (same promotion bar as the authed shards).
  public-e2e:
    name: Public-surface E2E (hosting emulator)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install test deps
        run: |
          cd tests
          npm install --silent --no-audit --no-fund
      - name: Install Playwright chromium
        run: |
          cd tests
          npx playwright install --with-deps chromium
      - name: Run public-surface specs against the hosting emulator
        run: |
          cd tests
          npx firebase-tools emulators:exec --only hosting --project nobigdeal-pro \
            'PLAYWRIGHT_BASE_URL=http://127.0.0.1:5000 playwright test --config=playwright.config.js --workers=1 pro-public.spec.js marketing.spec.js'
      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-public-traces
          path: tests/test-results/
          retention-days: 7

  # Brand-token computed-style assertions (2026-08-07 audit): the isolated
  # tests/visual workspace (own package.json + playwright.config serving
  # docs/ over http-server) was referenced by no workflow. These are token/
  # computed-style checks, not pixel screenshots — no goldens involved.
  # Advisory on introduction.
  visual-brand-tokens:
    name: Brand-token visual assertions
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install visual workspace deps
        run: |
          cd tests/visual
          npm install --silent --no-audit --no-fund
      - name: Install Playwright chromium
        run: |
          cd tests/visual
          npm run install:browsers
      - name: Run brand-token assertions
        run: |
          cd tests/visual
          npm test

  # Pixel-diff visual regression over the public /pro pages (2026-08-07
  # audit): the spec + npm scripts existed, appeared in zero workflows, and
  # NO baselines were ever generated. Baselines must be CI-RENDERED —
  # container-local font rasterization does not match ubuntu runners even at
  # the generous thresholds. The job self-selects its mode:
  #   • no committed snapshots dir → generates baselines + uploads them as
  #     an artifact; a human downloads, reviews, and commits them under
  #     tests/e2e/visual-regression.spec.js-snapshots/ (the bless step).
  #   • snapshots dir committed → compares and reports drift.
  # Advisory either way until the baselines are blessed and the job has a
  # green streak (promotion checklist in NEXT_SESSION-2026-08-07.md).
  visual-regression:
    name: Visual regression (public pro pages)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install test deps
        run: |
          cd tests
          npm install --silent --no-audit --no-fund
      - name: Install Playwright chromium
        run: |
          cd tests
          npx playwright install --with-deps chromium
      - name: Run visual regression (compare, or generate baselines on first run)
        run: |
          cd tests
          if [ -d e2e/visual-regression.spec.js-snapshots ]; then
            MODE=""
            echo "baselines committed — compare mode"
          else
            MODE="--update-snapshots"
            echo "no baselines — generating for review/bless"
          fi
          npx firebase-tools emulators:exec --only hosting --project nobigdeal-pro \
            "PLAYWRIGHT_BASE_URL=http://127.0.0.1:5000 playwright test --config=playwright.config.js --workers=1 visual-regression.spec.js $MODE"
      - name: Upload baselines / diffs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: visual-regression-output
          path: |
            tests/e2e/visual-regression.spec.js-snapshots/
            tests/test-results/
          retention-days: 14
