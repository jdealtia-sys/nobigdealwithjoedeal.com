name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke-tests:
    name: Smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      # Most smoke tests are dependency-free, but the photo-vision sanitizer
      # test does a real `require()` of functions/photo-vision.js, which
      # itself pulls in firebase-functions/v2/https. Install functions deps
      # so that require resolves.
      - name: Install functions deps
        run: |
          cd functions
          if [ -f package-lock.json ]; then
            npm ci --silent || npm install --silent --no-audit --no-fund
          else
            npm install --silent --no-audit --no-fund
          fi
      - name: Run smoke tests
        run: node tests/smoke.test.js
      # Security-sensitive privilege-escalation / cross-tenant guard logic
      # (requireTeamAdmin, callerMayManageTarget, normalizeRole, classifyClaims).
      # Previously local-only (npm run test:teamroles) — gated here so a future
      # edit can't silently re-open a fail-open hole or over-block a solo owner.
      - name: Run team/role + tenant guard tests
        run: node tests/team-roles.test.js
      # /photos canonical-timestamp gate: every write path must stamp
      # createdAt and both chronological queries must orderBy it (with
      # the matching composite indexes), or quick-upload / annotation
      # photos silently vanish from the feed + gallery. Dependency-free.
      - name: Run photos timestamp contract tests
        run: node tests/photos-timestamp-contract.test.js
      # Money-path gate (H3): the Stripe payment-link reconciliation must add a
      # sales-tax line and refuse to issue any link that wouldn't charge
      # invoice.total. Dependency-free logic mirror of functions/stripe.js.
      - name: Run Stripe payment-link tax reconciliation tests
        run: node tests/stripe-payment-link-tax.test.js
      # Theme legibility + completeness gate (audit Phase 3): every theme in both
      # registries must define the required vars and clear the WCAG contrast floor
      # as rendered. Dependency-free; extracts the real engine colour helpers.
      - name: Run theme QA
        run: node tests/theme-qa.test.js
      # Document render + multi-tenant brand-isolation gate: every doc type renders
      # without error and never leaks one tenant's brand into another's output.
      - name: Run docgen render + tenant-isolation tests
        run: node tests/docgen-render.test.js
      # DocPreflight ↔ renderer data contract: the modal and the renderers use
      # divergent key vocabularies; hydrateDerivedFields must bridge them so a
      # rep's entered value (carrier, payment amounts, job total, scope, dates…)
      # actually reaches the rendered legal document instead of a fabricated default.
      - name: Run docgen preflight-contract tests
        run: node tests/docgen-preflight-contract.test.js
      # T-4 AI-texting persona gate: the customizable persona (presets,
      # trait sliders, identity, free-text notes) must NEVER strip or
      # weaken the locked HARD-RULES guardrails — incl. against hostile
      # custom instructions / forged section headers. Dependency-free
      # (pure functions/handlers/ai-persona.js, no firebase imports).
      - name: Run AI-texting persona prompt tests
        run: node tests/ai-persona-prompt.test.js

      # Locks in the high-value fixes from the 2026-06-25/26 surface sweeps
      # (Vault #776, Close Board #777, Storm Center #778/#779, Academy #780) so
      # a silent revert is caught. Dependency-free (vm + fake-DOM sandboxes).
      - name: Run sweep regression tests
        run: node tests/sweep-regression.test.js

  site-integrity:
    name: Site integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      # Gate the defect classes the 2026-06 manual QC sweep fixed by hand:
      # dead internal links, 404'd assets, broken in-page/cross-page anchors.
      # Zero npm deps (Node builtins only) — no install step needed.
      # firebase.json redirects/rewrites are read at runtime, so hosting
      # config changes can't desync the checker.
      - name: Check links, assets, and anchors (docs/, excluding /pro + /admin)
        run: node scripts/check-site-integrity.js --quiet
      # Sitemap drift gate: build-sitemap.js dry-runs by default and exits 1
      # when the generated sitemap differs from docs/sitemap.xml (prints the
      # unified diff). Writes nothing without --write.
      - name: Check sitemap drift (dry-run diff)
        run: node scripts/build-sitemap.js

  syntax-check:
    name: Node syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Parse every .js under functions/ and docs/pro/js/
        run: |
          set -e
          for f in $(find functions docs/pro/js -name '*.js' -not -path '*/node_modules/*' -not -path '*/_archive/*'); do
            node --check "$f"
          done

  firestore-rules:
    name: Firestore rules tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install test deps
        run: |
          cd tests
          npm install --silent
      - name: Install firebase-tools globally
        run: npm install -g firebase-tools@13
      - name: Run Firestore rules tests under emulator
        run: |
          cd tests
          firebase emulators:exec --only firestore --project nbd-rules-test 'node firestore-rules.test.js'
      - name: Run cross-tenant isolation rules tests under emulator
        run: |
          cd tests
          firebase emulators:exec --only firestore --project nbd-xtenant-test 'node firestore-rules.cross-tenant.test.js'
      - name: Run Storage rules tests under emulator
        run: |
          cd tests
          firebase emulators:exec --only storage --project nbd-storage-test 'node storage-rules.test.js'

  functions-parse:
    name: Functions parse + dep install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Install functions deps (CI)
        # `npm ci` requires the lockfile to match package.json exactly.
        # When a feature branch adds deps but we haven't regenerated the
        # lock yet, fall back to `npm install` instead of failing CI.
        run: |
          cd functions
          if [ -f package-lock.json ]; then
            npm ci --silent || npm install --silent --no-audit --no-fund
          else
            npm install --silent --no-audit --no-fund
          fi

      # Fail the build on HIGH+ npm advisories. The known LOW and
      # MODERATE transitive advisories (see functions/NPM_AUDIT_ACCEPTED.md)
      # are below this threshold and intentionally not addressed — each
      # one is a transitive dep of firebase-admin / @google-cloud/*
      # whose vulnerable code path is unreachable from our handlers,
      # and the only available fixes are `npm audit fix --force`
      # downgrades that regress firebase-admin to 10.x (breaks
      # multi-tenant + App Check). Re-audit on every dep-review
      # sprint; any HIGH or CRITICAL is a P1.
      - name: Audit dependencies (high and above)
        run: |
          cd functions
          npm audit --audit-level=high
      - name: Require every integration module
        run: |
          cd functions
          node -e "
            const fs = require('fs');
            const files = fs.readdirSync('integrations').filter(f => f.endsWith('.js'));
            for (const f of files) {
              try {
                require('./integrations/' + f);
                console.log('OK ', f);
              } catch (e) {
                console.error('FAIL ', f, e.message);
                process.exit(1);
              }
            }
          "

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # Simple grep — fast first-pass for obvious patterns. Catches
      # the big ones before a push even completes.
      - name: Grep for obvious secrets
        run: |
          set -e
          echo "== Checking for committed private keys / tokens =="
          ! grep -rE '(-----BEGIN (RSA |EC |DSA |OPENSSH )?PRIVATE KEY-----|sk_live_[A-Za-z0-9]+|sk-ant-[A-Za-z0-9-]{20,}|SG\.[A-Za-z0-9_-]{22}\.[A-Za-z0-9_-]{43}|ghp_[A-Za-z0-9]{36})' --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=_archive --include='*.js' --include='*.html' --include='*.json' --include='*.md' .

      # Q5: full gitleaks scan — catches 130+ secret formats the
      # grep above doesn't (GCP SA JSON, Slack webhook, JWTs with
      # recognizable signatures, etc.). Runs against the whole
      # history so a secret that slipped in before gitleaks was
      # wired surfaces now.
      #
      # If this starts failing on legitimate matches, add an entry
      # to .gitleaksignore with the full fingerprint line from the
      # scanner output.
      - name: gitleaks scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "true"
          GITLEAKS_ENABLE_SUMMARY: "true"

  e2e-authed-emulator:
    name: Authed E2E (emulators)
    runs-on: ubuntu-latest
    # Rock 3: hermetic authed journey — seed a tenant in the Auth/Firestore
    # emulators, serve docs/ from the hosting emulator (the client SDK
    # auto-connects to emulators on localhost via nbd-emulator-connect.js),
    # and run pro-authed.spec.js against it. No prod credentials involved.
    # continue-on-error while the suite proves itself green; flip to required
    # after ~2 weeks of stable runs (BIG_ROCKS Rock 3 plan).
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      # The Firestore emulator runs on the JVM; firebase-tools 15+ (the tests
      # devDependency) requires JDK 21 — same setup as firebase-deploy.yml.
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Install test deps
        run: |
          cd tests
          npm install --silent --no-audit --no-fund
      - name: Install Playwright chromium
        run: |
          cd tests
          npx playwright install --with-deps chromium
      - name: Run authed E2E against emulators
        run: |
          cd tests
          npm run test:e2e:authed:emu
      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-authed-traces
          path: tests/test-results/
          retention-days: 7
